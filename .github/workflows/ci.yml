name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q src/yuaz_ddsp_resampler
      - name: Shell syntax
        run: find commands scripts -type f -name '*.command' -exec bash -n {} \;
